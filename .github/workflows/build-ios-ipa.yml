name: Build Native Swift iOS IPA (Sideloadly)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-ios-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync level JSON resources to iOS bundle
        run: |
          mkdir -p ios/BusFeverParty/Resources/levels
          cp -f src/levels/*.json ios/BusFeverParty/Resources/levels/

      - name: Check Xcode & iOS Simulators
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list devices available

      - name: Run Native Swift Unit & UI Screenshot Tests
        run: |
          DEST=$(xcrun simctl list devices available iPhone | grep -E 'iPhone 16|iPhone 15|iPhone 14' | grep -v 'SE' | grep -E '\([A-F0-9-]+\)' | head -n 1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          if [ -z "$DEST" ]; then
            DEST=$(xcrun simctl list devices available iPhone | grep -E '\([A-F0-9-]+\)' | head -n 1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          fi
          echo "Using Simulator ID: $DEST"
          xcrun simctl boot "$DEST" || true
          xcrun simctl bootstatus "$DEST" -b
          rm -rf ios/TestResults.xcresult ios_screenshots
          xcodebuild test \
            -project ios/BusFeverParty.xcodeproj \
            -scheme BusFeverParty \
            -destination "platform=iOS Simulator,id=$DEST" \
            -derivedDataPath ios/DerivedDataSim \
            -resultBundlePath ios/TestResults.xcresult
          mkdir -p ios_screenshots
          find "$HOME/Library/Developer/CoreSimulator/Devices/$DEST/data" -name "ios_sim_*.png" -exec cp -f {} ios_screenshots/ \; || true
          if [ -z "$(ls -A ios_screenshots)" ]; then
            find "$HOME/Library/Developer/CoreSimulator/Devices" -name "ios_sim_*.png" -exec cp -f {} ios_screenshots/ \; || true
          fi
          ls -lh ios_screenshots/
          test -f ios_screenshots/ios_sim_01_home.png
          test -f ios_screenshots/ios_sim_03_level1_start.png
          test -f ios_screenshots/ios_sim_04_level1_parked.png

      - name: Upload iOS Simulator UI Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-sim-screenshots
          path: ios_screenshots/*.png
          retention-days: 30

      - name: Build Pure Native iOS Release App (.app)
        run: |
          xcodebuild \
            -project ios/BusFeverParty.xcodeproj \
            -scheme BusFeverParty \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package Unsigned Native IPA for Sideloadly
        run: |
          rm -rf ipa_build BusFeverParty-Sideloadly.ipa
          mkdir -p ipa_build/Payload
          cp -R ios/DerivedData/Build/Products/Release-iphoneos/BusFeverParty.app ipa_build/Payload/BusFeverParty.app
          test -f ipa_build/Payload/BusFeverParty.app/Info.plist
          test -f ipa_build/Payload/BusFeverParty.app/BusFeverParty
          test -d ipa_build/Payload/BusFeverParty.app/levels
          (cd ipa_build && zip -qr ../BusFeverParty-Sideloadly.ipa Payload)
          ls -lh BusFeverParty-Sideloadly.ipa

      - name: Upload Native IPA Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusFeverParty-Native-Sideloadly-IPA
          path: BusFeverParty-Sideloadly.ipa
          retention-days: 90

      - name: Publish Native IPA to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" BusFeverParty-Sideloadly.ipa --clobber
          else
            gh release create "$TAG" BusFeverParty-Sideloadly.ipa \
              --title "Bus Fever Party — Pure Native Swift iOS IPA (Sideloadly)" \
              --notes "100% Native SwiftUI + SpriteKit iOS build (arm64, zero WebView). Sign and sideload via Sideloadly."
          fi
